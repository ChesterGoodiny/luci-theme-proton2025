name: "🐛 Bug Report / Отчет об ошибке"
description: "Сообщить о проблеме с версткой или работой темы / Report a styling or UI issue"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Перед отправкой / Before submitting:**
        1. Очистите кэш браузера (Ctrl+F5) и проверьте в режиме инкогнито.
        2. Попробуйте переключиться на стандартную тему `luci-theme-bootstrap`.
        
        Если проблема исчезла на Bootstrap — заполняйте форму ниже 👇

  - type: dropdown
    id: bootstrap_check
    attributes:
      label: "🔍 Проверка на стандартной теме / Bootstrap check"
      description: "Воспроизводится ли проблема на `luci-theme-bootstrap`?"
      options:
        - "❌ Нет, только в Proton2025 / No, only in Proton2025"
        - "✅ Да, на Bootstrap тоже / Yes, on Bootstrap too"
        - "🤷 Не проверял / Haven't checked"
    validations:
      required: true

  - type: dropdown
    id: openwrt_version
    attributes:
      label: "🔧 Версия OpenWrt / OpenWrt Version"
      options:
        - "23.05.x"
        - "24.10.x"
        - "25.x / Snapshot"
        - "Не знаю / Don't know"
    validations:
      required: true

  - type: dropdown
    id: theme_version
    attributes:
      label: "🎨 Версия темы / Theme Version"
      description: "Можно посмотреть в Системе → Программы или в настройках темы"
      options:
        - "v1.4.1 (Последняя / Latest)"
        - "v1.4.0"
        - "v1.3.x"
        - "v1.2.x"
        - "Git / Master / Сборка из исходников"
        - "Не знаю / Не уверен"
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: "📍 Где проявляется проблема? / Where does it occur?"
      options:
        - "🏠 Главная (Status → Overview)"
        - "🌐 Сеть (Network / Wireless)"
        - "⚙️ Система (System)"
        - "🔥 Firewall"
        - "🌡️ Температура (Status → Realtime → Temperature)"
        - "🔍 Поиск (Search bar)"
        - "🎨 Настройки темы (System → Language and Style)"
        - "📦 Сторонний пакет (OpenClash, Zerotier и др.)"
        - "📱 Мобильная версия (любая страница)"
        - "Другое / Other (опишу ниже)"
    validations:
      required: true

  - type: dropdown
    id: theme_mode
    attributes:
      label: "🌓 Режим темы / Theme Mode"
      options:
        - "🌙 Dark / Темный"
        - "☀️ Light / Светлый"
        - "🔄 Auto / Авто (Системный)"
        - "Любой / Any"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: "💻 Устройство / Device type"
      options:
        - "🖥️ Десктоп / Desktop"
        - "📱 Телефон / Phone"
        - "📟 Планшет / Tablet"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "🌐 Браузер / Browser"
      options:
        - "Chrome / Chromium / Edge"
        - "Firefox"
        - "Safari (macOS / iOS)"
        - "Другой / Other"
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: "🏷️ Тип проблемы / Problem type"
      options:
        - "📐 Верстка «поехала» / Layout broken"
        - "🎨 Неверные цвета / Wrong colors"
        - "🔤 Текст не помещается / Text overflow"
        - "🖱️ Элемент не кликается / Not clickable"
        - "📱 Мобильная адаптация / Mobile layout"
        - "⚡ Тормозит или мигает / Laggy or flashing"
        - "🔍 Поиск не работает / Search broken"
        - "Другое / Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Описание и шаги / Description & Steps"
      description: "Кратко опишите, что делали, что произошло и что ожидали."
      placeholder: "1. Перешел на...\n2. Нажал на...\n3. Увидел, что..."
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: "🔍 Ошибки консоли / Console Errors (опционально)"
      description: "Нажмите F12 → Console. Если есть красные ошибки, скопируйте их сюда."
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "📸 Скриншоты / Screenshots"
      description: "Перетащите файлы сюда (особенно важно для проблем мобильной верстки)."
    validations:
      required: false
