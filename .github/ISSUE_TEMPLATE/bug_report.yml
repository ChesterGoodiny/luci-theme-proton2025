name: "🐛 Bug Report / Отчет об ошибке"
description: "Report a styling or UI issue / Сообщить о проблеме с версткой или работой темы"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Before submitting / Перед отправкой:**
        1. Clear browser cache (Ctrl+F5) and test in incognito mode. / Очистите кэш браузера (Ctrl+F5) и проверьте в режиме инкогнито.
        2. Try switching to the default `luci-theme-bootstrap` theme. / Попробуйте переключиться на стандартную тему `luci-theme-bootstrap`.
        
        If the issue disappears on Bootstrap, please fill out the form below 👇
        Если проблема исчезла на Bootstrap — заполняйте форму ниже 👇

  - type: dropdown
    id: bootstrap_check
    attributes:
      label: "🔍 Bootstrap check / Проверка на стандартной теме"
      description: "Does the issue occur on `luci-theme-bootstrap`? / Воспроизводится ли проблема на `luci-theme-bootstrap`?"
      options:
        - "❌ No, only in Proton2025 / Нет, только в Proton2025"
        - "✅ Yes, on Bootstrap too / Да, на Bootstrap тоже"
        - "🤷 Haven't checked / Не проверял"
    validations:
      required: true

  - type: dropdown
    id: openwrt_version
    attributes:
      label: "🔧 OpenWrt Version / Версия OpenWrt"
      options:
        - "23.05.x"
        - "24.10.x"
        - "25.x / Snapshot"
        - "Don't know / Не знаю"
    validations:
      required: true

  - type: dropdown
    id: theme_version
    attributes:
      label: "🎨 Theme Version / Версия темы"
      description: "Check in System → Software or theme settings / Можно посмотреть в Система → Программы или в настройках темы"
      options:
        - "v1.4.1 (Latest / Последняя)"
        - "v1.4.0"
        - "v1.3.x"
        - "v1.2.x"
        - "Git / Master / Build from source (Сборка из исходников)"
        - "Not sure / Не уверен"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: "🌍 Interface Language / Язык интерфейса"
      description: "Which language is selected in LuCI? Important for long words / Какой язык выбран в настройках LuCI? Важно для длинных слов"
      options:
        - "🇺🇸 English"
        - "🇷🇺 Russian (Русский)"
        - "🇨🇳 Chinese (中文)"
        - "🇩🇪 German (Deutsch)"
        - "🇺🇦 Ukrainian (Українська)"
        - "🇪🇸 Spanish (Español)"
        - "🇵🇹 Portuguese (Português)"
        - "🇵🇱 Polish (Polski)"
        - "🇫🇷 French (Français)"
        - "🇮🇹 Italian (Italiano)"
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: "📍 Where does it occur? / Где проявляется проблема?"
      options:
        - "🏠 Status → Overview (Главная)"
        - "🌐 Network / Wireless (Сеть)"
        - "⚙️ System (Система)"
        - "🔥 Firewall"
        - "🌡️ Status → Realtime → Temperature (Температура)"
        - "🔍 Search bar (Поиск)"
        - "🎨 System → Language and Style / Theme settings (Настройки темы)"
        - "📦 Third-party package (OpenClash, Zerotier, etc.) / Сторонний пакет"
        - "📱 Mobile version (any page) / Мобильная версия"
        - "Other (describe below) / Другое (опишу ниже)"
    validations:
      required: true

  - type: dropdown
    id: theme_mode
    attributes:
      label: "🌓 Theme Mode / Режим темы"
      options:
        - "🌙 Dark / Темный"
        - "☀️ Light / Светлый"
        - "🔄 Auto (System) / Авто (Системный)"
        - "Any / Любой"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: "💻 Device type / Устройство"
      options:
        - "🖥️ Desktop / Десктоп"
        - "📱 Phone / Телефон"
        - "📟 Tablet / Планшет"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "🌐 Browser / Браузер"
      options:
        - "Chrome / Chromium"
        - "Google Chrome (Mobile / Android)"
        - "Firefox"
        - "Firefox Mobile"
        - "Safari (macOS)"
        - "Safari (iOS / iPhone / iPad)"
        - "Edge (Microsoft)"
        - "Opera / Opera GX"
        - "Brave"
        - "Vivaldi"
        - "Samsung Internet"
        - "Yandex Browser / Яндекс Браузер"
        - "Other / Другой"
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: "🏷️ Problem type / Тип проблемы"
      options:
        - "📐 Layout broken / Верстка «поехала»"
        - "🎨 Wrong colors / Неверные цвета"
        - "🔤 Text overflow / Текст не помещается"
        - "🖱️ Not clickable / Элемент не кликается"
        - "📱 Mobile layout / Мобильная адаптация"
        - "⚡ Laggy or flashing / Тормозит или мигает"
        - "🔍 Search broken / Поиск не работает"
        - "Other / Другое"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description & Steps / Описание и шаги"
      description: "Briefly describe what you did, what happened, and what you expected / Кратко опишите, что делали, что произошло и что ожидали"
      placeholder: |
        1. Went to... / 1. Перешел на...
        2. Clicked on... / 2. Нажал на...
        3. Saw that... / 3. Увидел, что...
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: "🔍 Console Errors (optional) / Ошибки консоли (опционально)"
      description: "Press F12 → Console. If there are red errors, copy them here / Нажмите F12 → Console. Если есть красные ошибки, скопируйте их сюда"
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "📸 Screenshots / Скриншоты"
      description: "Drag and drop files here (especially important for mobile layout issues) / Перетащите файлы сюда (особенно важно для проблем мобильной верстки)"
    validations:
      required: false
